services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aho
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aho}
      POSTGRES_DB: aho
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aho -d aho"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aho:${POSTGRES_PASSWORD:-aho}@postgres:5432/aho
    command: ["sh", "-c", "alembic upgrade head && python -m aho.seed && uvicorn aho.api:app --host 0.0.0.0 --port 8000"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 30
  telegram-bot:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aho:${POSTGRES_PASSWORD:-aho}@postgres:5432/aho
    command: ["python", "-m", "aho.bot"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
  admin-web:
    build:
      context: apps/admin-web
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
